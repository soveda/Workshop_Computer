draft: true
Name: JP8K
short-description: JP-8000 / JP-8080 inspired supersaw voice with CV/MIDI synth and sting sequencer modes.
summary: >
  A Workshop Computer virtual-analog voice inspired by the JP-8000 and JP-8080
  supersaw sound, with a Sandstorm-inspired initial setup documented for bright
  gated leads. Flip Z up for a playable CV/MIDI synth voice, or set Z middle
  for a clockable 32-step sequencer seeded from the main sting rhythm in the
  supplied Sandstorm MIDI file. Z down is a momentary accent/forced-gate gesture.
  X spreads seven fixed-point saw oscillators, while Y darkens or brightens the
  stack before it leaves the stereo audio outs. USB MIDI works in both device
  and host modes for note/gate playability, pitch bend, and basic CC control.
Language: C++ (RP2040 Pico SDK / ComputerCard)
Creator: Adrian Vos + AI
Version: "0.1.14"
Status: WIP
License: MIT
date-created: 2026-09-01
date-updated: 2026-09-13
Editor: web

tags:
  - oscillator
  - synthesizer
  - supersaw
  - drone
  - cv-gate
  - virtual-analog

panel:
  inputs:
    - id: AudioIn1
      name: Reserved
      description: Reserved for a future audio-rate input path
    - id: AudioIn2
      name: Reserved
      description: Reserved for a future character input or external mix path
    - id: CVIn1
      name: Pitch CV
      description: Bipolar pitch modulation added to Main in CV/gate mode, or to the active MIDI note in MIDI mode; hardware-trimmed from the fr330hfr33/CosmikC1zzl3 raw 1V/oct convention to about 313 input counts per volt
    - id: CVIn2
      name: Spread CV
      description: Adds modulation to the detune/spread amount set by X
    - id: PulseIn1
      name: Gate / Reset
      description: Sustains the synth envelope while high in Z-up synth mode; resets the sequencer in Z-middle sequencer mode
    - id: PulseIn2
      name: Accent / Clock
      description: Adds a brighter attack snap and level lift while high in synth mode; clocks the sequencer from rising edges in sequencer mode
  outputs:
    - id: AudioOut1
      name: Left / Mono
      description: Supersaw voice output
    - id: AudioOut2
      name: Right
      description: Stereo companion output in all modes
    - id: CVOut1
      name: Pitch Monitor
      description: Approximate pitch monitor CV derived from the internal note value
    - id: CVOut2
      name: Brightness Monitor
      description: CV following the Y brightness/filter setting
    - id: PulseOut1
      name: Gate Monitor
      description: High while the voice envelope is being held open
    - id: PulseOut2
      name: Saw Clock
      description: Square pulse derived from the centre oscillator phase

controls:
  switch:
    up:
      name: Synth
      description: CV/gate and USB MIDI playable supersaw voice
    middle:
      name: Sequencer
      description: Internal or externally clocked 32-step supersaw sequencer seeded with a Sandstorm-sting pattern
    down:
      name: Accent
      description: Momentary held accent that forces the envelope open and slightly lifts the level
  knobs:
    - main:
        name: Tune
        description: Tune/transpose in synth mode; tempo in sequencer mode; ignored while a MIDI note is active
      x:
        name: Spread
        description: Detunes the seven saw oscillators from single-saw tuning mode at minimum to a wide supersaw cloud
      y:
        name: Brightness
        description: One-pole tone control from warm pad to bright raw saw
  leds:
    - display: list
      items:
        - id: LED0
          name: Synth Mode
          description: Bright in Z-up synth mode and dim in sequencer mode
        - id: LED1
          name: Width / Sequencer Tick
          description: Brightness follows stereo spread in synth mode and pulses with sequencer movement in sequencer mode
        - id: LED2
          name: Gate
          description: Lit while the voice is open
        - id: LED3
          name: Brightness
          description: Brightness follows the Y tone control
        - id: LED4
          name: USB MIDI
          description: Dim in USB device mode, brighter in USB host mode, and flashes bright on MIDI activity
        - id: LED5
          name: Envelope / MIDI Note
          description: Brightness follows the envelope, or stays bright while a MIDI note is held
